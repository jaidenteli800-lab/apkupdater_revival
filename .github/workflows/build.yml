name: APKUpdater Revival

on:
  push:
    branches:
      - 3.x

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: apkupdater-revival-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  BRANCH_NAME: "3.x"
  APP_NAME: "APKUpdater Revival"
  GEMINI_MODEL: "gemini-flash-latest"

jobs:

  # ============================================================
  # 🚀 EVERYTHING
  # ============================================================

  revival:
    name: 🚀 Build • Test • Analyze • AI • Release
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # JAVA / GRADLE
      # --------------------------------------------------------

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 🔧 Prepare Gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      # --------------------------------------------------------
      # VERSION
      # --------------------------------------------------------

      - name: 🏷️ Calculate CI Version
        id: version
        shell: bash
        run: |
          VERSION="1.0.0-ci.${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "🚀 APKUPDATER REVIVAL"
          echo "Version: $VERSION"
          echo "Branch:  $GITHUB_REF_NAME"
          echo "Commit:  $GITHUB_SHA"
          echo "=========================================="

      # --------------------------------------------------------
      # CHANGE INTELLIGENCE
      # --------------------------------------------------------

      - name: 🔎 Analyze Git Changes
        id: changes
        shell: bash
        run: |
          set -e

          BEFORE="${{ github.event.before }}"

          if [ -z "$BEFORE" ] || \
             [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BEFORE="$(git rev-parse HEAD^)"
            else
              BEFORE=""
            fi
          fi

          if [ -n "$BEFORE" ]; then
            RANGE="$BEFORE..${GITHUB_SHA}"

            git diff --name-status "$RANGE" > changed-files.txt || true
            git diff --stat "$RANGE" > change-stat.txt || true

            git diff --numstat "$RANGE" > numstat.txt || true

            FILES_CHANGED="$(git diff --name-only "$RANGE" | wc -l | tr -d ' ')"
            LINES_ADDED="$(git diff --numstat "$RANGE" | awk '{a += $1} END {print a+0}')"
            LINES_REMOVED="$(git diff --numstat "$RANGE" | awk '{d += $2} END {print d+0}')"

            git diff "$RANGE" > full-diff.txt || true

          else
            echo "Initial commit — no previous comparison available."

            echo "Initial commit" > changed-files.txt
            echo "Initial commit" > change-stat.txt
            echo "" > numstat.txt
            echo "" > full-diff.txt

            FILES_CHANGED="$(git ls-files | wc -l | tr -d ' ')"
            LINES_ADDED="0"
            LINES_REMOVED="0"
          fi

          TOTAL_CHANGES=$((LINES_ADDED + LINES_REMOVED))

          echo "files_changed=$FILES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "lines_added=$LINES_ADDED" >> "$GITHUB_OUTPUT"
          echo "lines_removed=$LINES_REMOVED" >> "$GITHUB_OUTPUT"
          echo "total_changes=$TOTAL_CHANGES" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "📊 CHANGE INTELLIGENCE"
          echo "=========================================="
          echo "Files changed: $FILES_CHANGED"
          echo "Lines added:   $LINES_ADDED"
          echo "Lines removed: $LINES_REMOVED"
          echo "Total changes: $TOTAL_CHANGES"
          echo "=========================================="

      # --------------------------------------------------------
      # COMMIT INTELLIGENCE
      # --------------------------------------------------------

      - name: 🧠 Collect Commit History
        shell: bash
        run: |
          git log -25 \
            --pretty=format:'%h | %ad | %an | %s' \
            --date=short > commits.txt

          git status --short > repository-status.txt

          {
            echo "PROJECT: APKUpdater Revival"
            echo
            echo "BRANCH: $GITHUB_REF_NAME"
            echo
            echo "COMMIT: $GITHUB_SHA"
            echo
            echo "RECENT COMMITS:"
            cat commits.txt
            echo
            echo "CHANGED FILES:"
            cat changed-files.txt
            echo
            echo "CHANGE STATISTICS:"
            cat change-stat.txt
          } > repository-intelligence.txt

      # --------------------------------------------------------
      # BUILD
      # --------------------------------------------------------

      - name: 🧹 Clean Project
        run: ./gradlew clean

      - name: 🧪 Run Unit Tests
        run: ./gradlew test

      - name: 🔍 Run Android Lint
        run: ./gradlew lint

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug

      # --------------------------------------------------------
      # APK PROCESSING
      # --------------------------------------------------------

      - name: 🔎 Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "❌ No debug APK was produced."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: 📦 Rename APK
        id: rename
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p release

          cp "${{ steps.apk.outputs.apk_path }}" \
            "release/APKUpdater-Revival-${VERSION}-debug.apk"

          echo "release_apk=release/APKUpdater-Revival-${VERSION}-debug.apk" \
            >> "$GITHUB_OUTPUT"

      - name: 🔐 Generate SHA-256
        shell: bash
        run: |
          sha256sum release/*.apk > release/SHA256SUMS.txt

          echo "=========================================="
          cat release/SHA256SUMS.txt
          echo "=========================================="

      - name: 📊 APK Information
        shell: bash
        run: |
          APK="$(find release -name '*.apk' | head -n 1)"

          SIZE="$(du -h "$APK" | cut -f1)"

          echo "APK size: $SIZE"

          {
            echo "# 📦 APK Build Information"
            echo
            echo "- **Project:** APKUpdater Revival"
            echo "- **Version:** ${{ steps.version.outputs.version }}"
            echo "- **Branch:** $GITHUB_REF_NAME"
            echo "- **Commit:** $GITHUB_SHA"
            echo "- **APK size:** $SIZE"
            echo "- **Signing:** Debug signing"
            echo "- **Tests:** Passed"
            echo "- **Lint:** Passed"
          } > release/build-info.md

      # --------------------------------------------------------
      # 🤖 GEMINI AI
      # --------------------------------------------------------

      - name: 🤖 Gemini AI — Release Intelligence
        id: ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY is missing."
            echo
            echo "Add it at:"
            echo "Repository → Settings → Secrets and variables → Actions"
            echo
            echo "Secret name:"
            echo "GEMINI_API_KEY"
            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          def read_file(path, limit=None):
              try:
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      data = f.read()
                  if limit:
                      return data[:limit]
                  return data
              except Exception:
                  return ""

          version = "${{ steps.version.outputs.version }}"

          files_changed = "${{ steps.changes.outputs.files_changed }}"
          lines_added = "${{ steps.changes.outputs.lines_added }}"
          lines_removed = "${{ steps.changes.outputs.lines_removed }}"
          total_changes = "${{ steps.changes.outputs.total_changes }}"

          commits = read_file("commits.txt", 30000)
          changed_files = read_file("changed-files.txt", 30000)
          stats = read_file("change-stat.txt", 20000)
          diff = read_file("full-diff.txt", 100000)

          context = f"""
          PROJECT
          APKUpdater Revival

          VERSION
          {version}

          BRANCH
          {os.environ.get("GITHUB_REF_NAME", "3.x")}

          COMMIT
          {os.environ.get("GITHUB_SHA", "")}

          CHANGE STATISTICS
          Files changed: {files_changed}
          Lines added: {lines_added}
          Lines removed: {lines_removed}
          Total changed lines: {total_changes}

          RECENT COMMITS
          {commits}

          CHANGED FILES
          {changed_files}

          CHANGE STAT
          {stats}

          CODE DIFF
          {diff}
          """

          prompt = f"""
          You are the senior Android release engineer for APKUpdater Revival.

          Analyze the REAL repository information below.

          Do not invent changes.
          Do not claim a feature exists unless the supplied diff supports it.
          Do not make up bug fixes.
          Do not make up performance improvements.
          Do not make up tests.

          Your job is to produce an extremely polished release package.

          REPOSITORY DATA:
          {context}

          Return EXACTLY this JSON structure:

          {{
            "release_notes": "...",
            "short_summary": "...",
            "code_review": "...",
            "risk_level": "LOW|MEDIUM|HIGH",
            "highlights": [
              "...",
              "...",
              "..."
            ]
          }}

          RELEASE NOTES REQUIREMENTS:

          Use detailed Markdown.

          Include:

          # 🚀 APKUpdater Revival

          ## ✨ What's New

          ## 🛠️ Improvements

          ## 🐛 Fixes

          ## 🎨 UI / UX

          ## ⚡ Performance

          ## 🔐 Security

          ## ⚙️ Developer & Build Changes

          ## 🧪 Validation

          ## 📦 Download

          ## 🔎 Change Statistics

          ## ⚠️ Notes

          ## 🤖 AI Release Analysis

          Only include sections when there is meaningful information.

          Explain technical changes in a way normal users can understand.

          Mention that this is a DEBUG-signed CI build.

          CODE REVIEW REQUIREMENTS:

          Look for:

          - possible bugs
          - risky changes
          - nullability issues
          - API compatibility problems
          - deprecated Android APIs
          - security problems
          - performance problems
          - dependency problems
          - test gaps
          - suspicious or incomplete changes

          If there are no obvious problems, say so.

          Do not modify code.
          Do not suggest that something is broken unless evidence supports it.

          The release should become more detailed when the change is large.
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.25,
                  "responseMimeType": "application/json"
              }
          }

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-flash-latest:generateContent"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-goog-api-key": os.environ["GEMINI_API_KEY"]
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              text = result["candidates"][0]["content"]["parts"][0]["text"]

              data = json.loads(text)

              release_notes = data.get("release_notes", "")
              short_summary = data.get("short_summary", "")
              code_review = data.get("code_review", "")
              risk_level = data.get("risk_level", "UNKNOWN")
              highlights = data.get("highlights", [])

              if not release_notes:
                  raise RuntimeError("Gemini returned empty release notes.")

              with open("release-notes.md", "w", encoding="utf-8") as f:
                  f.write(release_notes.strip())
                  f.write("\n\n---\n\n")
                  f.write("## 📊 Automated Build Data\n\n")
                  f.write(f"- Files changed: {files_changed}\n")
                  f.write(f"- Lines added: {lines_added}\n")
                  f.write(f"- Lines removed: {lines_removed}\n")
                  f.write(f"- Total changed lines: {total_changes}\n")
                  f.write(f"- AI risk assessment: **{risk_level}**\n")

              with open("AI-SHORT-SUMMARY.md", "w", encoding="utf-8") as f:
                  f.write("# 🤖 AI Summary\n\n")
                  f.write(short_summary.strip())
                  f.write("\n")

              with open("AI-CODE-REVIEW.md", "w", encoding="utf-8") as f:
                  f.write("# 🤖 AI Code Review\n\n")
                  f.write(code_review.strip())
                  f.write("\n\n## Highlights\n\n")

                  for item in highlights:
                      f.write(f"- {item}\n")

              print("✅ Gemini analysis completed.")
              print(f"Risk level: {risk_level}")

          except Exception as error:
              print("⚠️ Gemini failed:")
              print(error)
              print()
              print("Generating safe fallback release notes.")

              with open("release-notes.md", "w", encoding="utf-8") as f:
                  f.write(f"""# 🚀 APKUpdater Revival

          ## 📦 CI Build

          Automated APKUpdater Revival CI build **{version}**.

          ## 🧪 Validation

          - Unit tests completed successfully.
          - Android lint completed successfully.
          - Debug APK assembled successfully.
          - SHA-256 checksum generated.

          ## 📊 Change Statistics

          - Files changed: {files_changed}
          - Lines added: {lines_added}
          - Lines removed: {lines_removed}
          - Total changed lines: {total_changes}

          ## 📥 Download

          The debug-signed APK is attached to this release.

          ## 🤖 AI Release Analysis

          Gemini was unavailable during this run, so the CI pipeline generated
          these fallback release notes.

          ## ⚠️ Important

          This is a DEBUG-signed CI build and is intended for testing.
          """)

              with open("AI-SHORT-SUMMARY.md", "w", encoding="utf-8") as f:
                  f.write(
                      "# 🤖 AI Summary\n\n"
                      "Gemini was unavailable for this build. "
                      "The fallback CI summary was generated automatically.\n"
                  )

              with open("AI-CODE-REVIEW.md", "w", encoding="utf-8") as f:
                  f.write(
                      "# 🤖 AI Code Review\n\n"
                      "Gemini was unavailable for this build. "
                      "No AI code review was generated.\n"
                  )

          PY

      # --------------------------------------------------------
      # CREATE COMPLETE BUILD REPORT
      # --------------------------------------------------------

      - name: 📋 Generate Build Report
        shell: bash
        run: |
          {
            echo "# 🚀 APKUpdater Revival CI Report"
            echo
            echo "## Build"
            echo
            echo "- Version: **${{ steps.version.outputs.version }}**"
            echo "- Branch: **$GITHUB_REF_NAME**"
            echo "- Commit: **$GITHUB_SHA**"
            echo "- Runner: **$RUNNER_OS**"
            echo "- Java: **17**"
            echo
            echo "## Changes"
            echo
            echo "- Files changed: **${{ steps.changes.outputs.files_changed }}**"
            echo "- Lines added: **${{ steps.changes.outputs.lines_added }}**"
            echo "- Lines removed: **${{ steps.changes.outputs.lines_removed }}**"
            echo "- Total changes: **${{ steps.changes.outputs.total_changes }}**"
            echo
            echo "## Validation"
            echo
            echo "✅ Unit tests passed"
            echo "✅ Android lint passed"
            echo "✅ Debug APK assembled"
            echo "✅ SHA-256 generated"
            echo "✅ Gemini analysis completed or fallback generated"
          } > CI-REPORT.md

      # --------------------------------------------------------
      # UPLOAD ARTIFACTS
      # --------------------------------------------------------

      - name: 📦 Upload Complete CI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: APKUpdater-Revival-${{ steps.version.outputs.version }}
          path: |
            release/*.apk
            release/SHA256SUMS.txt
            release/build-info.md
            release-notes.md
            AI-SHORT-SUMMARY.md
            AI-CODE-REVIEW.md
            CI-REPORT.md
            changed-files.txt
            change-stat.txt
            commits.txt
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # GITHUB RELEASE
      # --------------------------------------------------------

      - name: 🚀 Create GitHub Release
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "🚀 APKUpdater Revival v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          prerelease: true
          draft: false
          generate_release_notes: false
          files: |
            release/*.apk
            release/SHA256SUMS.txt
            release/build-info.md
            AI-SHORT-SUMMARY.md
            AI-CODE-REVIEW.md
            CI-REPORT.md
            changed-files.txt
            change-stat.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # FINAL SUMMARY
      # --------------------------------------------------------

      - name: 🎉 Final Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "# 🚀 APKUpdater Revival"
            echo
            echo "## Build"
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "## Changes"
            echo "- Files changed: **${{ steps.changes.outputs.files_changed }}**"
            echo "- Lines added: **${{ steps.changes.outputs.lines_added }}**"
            echo "- Lines removed: **${{ steps.changes.outputs.lines_removed }}**"
            echo "- Total changes: **${{ steps.changes.outputs.total_changes }}**"
            echo
            echo "## Pipeline"
            echo "- 🧹 Clean"
            echo "- 🧪 Tests"
            echo "- 🔍 Lint"
            echo "- 🏗️ Debug APK"
            echo "- 🔐 SHA-256"
            echo "- 🤖 Gemini AI"
            echo "- 📦 Artifact"
            echo "- 🚀 GitHub Release"
          } >> "$GITHUB_STEP_SUMMARY"
