name: APKUpdater Revival - Build & Release

on:
  push:
    branches:
      - 3.x

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apkupdater-revival-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  STABLE_VERSION: "1.0.0"
  APP_NAME: "APKUpdater Revival"

jobs:
  build:
    name: 🏗️ Build APKUpdater Revival
    runs-on: ubuntu-24.04

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: 🔢 Set stable version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${STABLE_VERSION}"
          BUILD_TYPE="stable"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=${BUILD_TYPE}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo " APKUpdater Revival"
          echo "=========================================="
          echo "Version: ${VERSION}"
          echo "Type:    ${BUILD_TYPE}"
          echo "Branch:  ${GITHUB_REF_NAME}"
          echo "Commit:  ${GITHUB_SHA}"
          echo "=========================================="

      - name: 🧠 Analyze project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " APKUpdater Revival Project"
          echo "=========================================="

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch:     ${GITHUB_REF_NAME}"
          echo "Commit:     ${GITHUB_SHA}"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      - name: 🔧 Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: 🧹 Clean project
        shell: bash
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: 🧪 Run tests
        shell: bash
        run: |
          ./gradlew test \
            --no-daemon \
            --stacktrace

      - name: 🔍 Run Android lint
        shell: bash
        run: |
          ./gradlew lint \
            --no-daemon \
            --stacktrace

      - name: 🏗️ Build APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: 🔎 Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -print \
            | sort \
            | head -n 1)"

          if [[ -z "${APK_SOURCE}" ]]; then
            echo "❌ No APK was produced."
            echo ""
            echo "APK files found:"
            find . -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK source:"
          echo "${APK_SOURCE}"

          mkdir -p release

          FINAL_APK="release/APKUpdater-Revival-${VERSION}.apk"

          cp "${APK_SOURCE}" "${FINAL_APK}"

          if [[ ! -f "${FINAL_APK}" ]]; then
            echo "❌ Failed to copy APK."
            exit 1
          fi

          if [[ ! -s "${FINAL_APK}" ]]; then
            echo "❌ APK is empty."
            exit 1
          fi

          echo "APK_PATH=${FINAL_APK}" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          echo "${FINAL_APK}"

      - name: ✅ Verify APK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${APK_PATH}" ]]; then
            echo "❌ APK does not exist."
            exit 1
          fi

          if [[ ! -s "${APK_PATH}" ]]; then
            echo "❌ APK is empty."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "${APK_PATH}")"
          APK_SHA256="$(sha256sum "${APK_PATH}" | awk '{print $1}')"

          echo "=========================================="
          echo " APK VERIFIED"
          echo "=========================================="
          echo "File:   ${APK_PATH}"
          echo "Size:   ${APK_SIZE} bytes"
          echo "SHA256: ${APK_SHA256}"
          echo "=========================================="

          echo "APK_SIZE=${APK_SIZE}" >> "$GITHUB_ENV"
          echo "APK_SHA256=${APK_SHA256}" >> "$GITHUB_ENV"

      - name: 📋 Collect release information
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE="$(git log -1 --pretty=%s)"
          COMMIT_BODY="$(git log -1 --pretty=%b)"

          CHANGES="$(git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            HEAD || true)"

          if [[ -z "${CHANGES}" ]]; then
            CHANGES="No file-level changes were detected for this commit."
          fi

          {
            echo "COMMIT_MESSAGE<<EOF"
            echo "${COMMIT_MESSAGE}"
            echo "EOF"

            echo "COMMIT_BODY<<EOF"
            echo "${COMMIT_BODY}"
            echo "EOF"

            echo "CHANGES<<EOF"
            echo "${CHANGES}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 🤖 Generate AI release notes
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERSION: ${{ env.VERSION }}
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          set -u

          echo "=========================================="
          echo " AI RELEASE NOTES"
          echo "=========================================="

          cat > final-release-notes.md <<EOF
          # APKUpdater Revival ${VERSION}

          ## What's included

          - First stable release of APKUpdater Revival.
          - Stable version 1.0.0.
          - Official APKUpdater Revival release package.

          ## Release

          This is the first stable release of APKUpdater Revival.
          EOF

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "⚠️ GEMINI_API_KEY is not configured."
            echo "ℹ️ Using clean built-in release notes."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os

          version = os.environ.get("VERSION", "1.0.0")
          app_name = os.environ.get("APP_NAME", "APKUpdater Revival")

          prompt = f"""Write clean, concise GitHub release notes for:

          {app_name} version {version}

          This is the FIRST REAL STABLE RELEASE.

          IMPORTANT:
          - The app name is exactly "APKUpdater Revival".
          - Never call it "APKUpdater" by itself.
          - Never mention debug.
          - Never mention CI.
          - Never mention GitHub Actions.
          - Never mention Gemini.
          - Never mention automation.
          - Never mention build configuration.
          - Never mention internal workflow changes.
          - Never mention prerelease.
          - Never mention beta.
          - Never mention alpha.
          - Never invent features.
          - Keep the notes short and user-facing.
          - Do not include download instructions.
          - Do not include hashes.
          - Do not include file sizes.

          Use exactly this structure:

          # APKUpdater Revival {version}

          ## What's included

          - First stable release of APKUpdater Revival.
          - Stable version 1.0.0.
          - Official APKUpdater Revival release package.

          ## Release

          This is the first stable release of APKUpdater Revival.
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "thinkingConfig": {
                      "thinkingLevel": "low"
                  },
                  "maxOutputTokens": 1000
              }
          }

          with open("gemini-request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          HTTP_STATUS="$(curl \
            --silent \
            --show-error \
            --location \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-goog-api-key: ${GEMINI_API_KEY}" \
            --output gemini-response.json \
            --write-out "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            --data-binary @gemini-request.json \
            || true)"

          echo "Gemini HTTP status: ${HTTP_STATUS}"

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "⚠️ Gemini unavailable."
            echo "ℹ️ Keeping clean built-in release notes."
            exit 0
          fi

          python3 - <<'PY'
          import json

          try:
              with open("gemini-response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              candidates = data.get("candidates", [])

              if not candidates:
                  raise ValueError("No candidates returned")

              parts = candidates[0].get("content", {}).get("parts", [])

              generated = ""

              for part in parts:
                  if isinstance(part, dict) and part.get("text"):
                      generated += part["text"]

              generated = generated.strip()

              if not generated:
                  raise ValueError("Empty response")

              # Safety cleanup in case the model ignores the naming instructions.
              generated = generated.replace(
                  "# APKUpdater ",
                  "# APKUpdater Revival "
              )

              generated = generated.replace(
                  "This is the first stable release of APKUpdater.",
                  "This is the first stable release of APKUpdater Revival."
              )

              with open("ai-release-notes.md", "w", encoding="utf-8") as f:
                  f.write(generated)

          except Exception as error:
              print(f"Gemini response parsing failed: {error}")
          PY

          if [[ -s "ai-release-notes.md" ]]; then
            cp ai-release-notes.md final-release-notes.md
            echo "✅ Clean AI release notes generated."
          else
            echo "⚠️ AI output was empty or invalid."
            echo "ℹ️ Using clean built-in release notes."
          fi

          echo ""
          echo "=========================================="
          echo " FINAL RELEASE NOTES"
          echo "=========================================="

          cat final-release-notes.md

      - name: 📝 Verify release notes
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "final-release-notes.md" ]]; then
            echo "❌ Release notes file does not exist."
            exit 1
          fi

          if [[ ! -s "final-release-notes.md" ]]; then
            echo "❌ Release notes file is empty."
            exit 1
          fi

          echo "✅ Release notes are ready."

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: APKUpdater-Revival-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          archive: false

      - name: 🚀 Create stable GitHub release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.STABLE_VERSION }}
          name: APKUpdater Revival ${{ env.STABLE_VERSION }}
          body_path: final-release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.APK_PATH }}

      - name: 📊 Final build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# 🚀 APKUpdater Revival Build"
            echo ""
            echo "## Build"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| App | \`APKUpdater Revival\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Type | \`${BUILD_TYPE}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""

            if [[ -f "${APK_PATH:-}" ]]; then
              echo "## APK"
              echo ""
              echo "| Property | Value |"
              echo "|---|---|"
              echo "| File | \`$(basename "${APK_PATH}")\` |"
              echo "| Size | \`${APK_SIZE:-unknown}\` bytes |"
              echo "| SHA-256 | \`${APK_SHA256:-unknown}\` |"
            else
              echo "## APK"
              echo ""
              echo "APK was not produced."
            fi

            echo ""
            echo "## Stable Release"
            echo ""
            echo "✅ Release: \`v${STABLE_VERSION}\`"
            echo ""
            echo "📦 GitHub Release contains only the APK."
          } >> "$GITHUB_STEP_SUMMARY"
