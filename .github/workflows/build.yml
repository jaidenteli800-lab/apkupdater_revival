name: APKUpdater Revival Build

on:
  push:
    branches:
      - 3.x

  workflow_dispatch:
    inputs:
      release:
        description: "Create a stable v1.0.0 release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: apkupdater-revival-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  STABLE_VERSION: "1.0.0"

jobs:
  build:
    name: 🚀 Build APKUpdater
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: 📥 Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # JAVA
      # ============================================================

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # VERSION
      # ============================================================

      - name: 🔢 Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                "${{ inputs.release }}" == "true" ]]; then

            VERSION="${STABLE_VERSION}"

          elif [[ "${{ github.ref_name }}" == "3.x" ]]; then

            VERSION="1.0.0-ci.${GITHUB_RUN_NUMBER}"

          else

            VERSION="1.0.0-ci.${GITHUB_RUN_NUMBER}"

          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo " APKUPDATER VERSION"
          echo "=========================================="
          echo "$VERSION"
          echo "=========================================="

      # ============================================================
      # CHANGE INFORMATION
      # ============================================================

      - name: 🧠 Analyze changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          echo "Collecting change information..."

          COMMITS="$(
            git log -20 \
              --pretty=format:'- %h — %s'
          )"

          CHANGED_FILES="$(
            git diff --name-only HEAD^ HEAD 2>/dev/null \
            || git ls-files
          )"

          COMMIT_COUNT="$(
            git rev-list --count HEAD
          )"

          FILE_COUNT="$(
            git ls-files | wc -l
          )"

          {
            echo "COMMITS<<EOF"
            echo "$COMMITS"
            echo "EOF"

            echo "CHANGED_FILES<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"

            echo "COMMIT_COUNT=$COMMIT_COUNT"
            echo "FILE_COUNT=$FILE_COUNT"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # CLEAN
      # ============================================================

      - name: 🧹 Clean project
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew clean --no-daemon

      # ============================================================
      # TESTS
      # ============================================================

      - name: 🧪 Run tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew test --no-daemon

      # ============================================================
      # LINT
      # ============================================================

      - name: 🔎 Run Android lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew lint --no-daemon

      # ============================================================
      # BUILD
      # ============================================================

      - name: 🏗️ Build APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # FIND APK
      # ============================================================

      - name: 📦 Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find . \
              -type f \
              -name '*.apk' \
              -not -path './comparison/*' \
              | head -n 1
          )"

          if [[ -z "$APK" ]]; then
            echo "❌ No APK was produced."
            exit 1
          fi

          mkdir -p release

          FINAL_APK="release/APKUpdater-${VERSION}.apk"

          cp "$APK" "$FINAL_APK"

          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"
          echo "apk_path=$FINAL_APK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo " APK READY"
          echo "=========================================="
          echo "Name: APKUpdater-${VERSION}.apk"
          echo "=========================================="

      # ============================================================
      # APK INFORMATION
      # ============================================================

      - name: 📊 Calculate APK information
        id: apk_info
        shell: bash
        run: |
          set -euo pipefail

          SIZE_BYTES="$(
            stat -c%s "$APK_PATH"
          )"

          SIZE_MB="$(
            awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1048576}"
          )"

          SHA256="$(
            sha256sum "$APK_PATH" | cut -d' ' -f1
          )"

          echo "APK_SIZE_BYTES=$SIZE_BYTES" >> "$GITHUB_ENV"
          echo "APK_SIZE_MB=$SIZE_MB" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"

          echo "APK size: ${SIZE_MB} MB"
          echo "SHA-256: ${SHA256}"

      # ============================================================
      # GEMINI AI
      # ============================================================

      - name: 🤖 Generate AI release description
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMITS: ${{ steps.changes.outputs.COMMITS }}
          CHANGED_FILES: ${{ steps.changes.outputs.CHANGED_FILES }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "Gemini API key is not configured."
            exit 0
          fi

          PROMPT="$(cat <<EOF
You are the release-note AI for APKUpdater Revival.

Generate a polished GitHub release description.

IMPORTANT RULES:

- Call the product "APKUpdater".
- NEVER call it a debug APK.
- NEVER mention debug signing.
- NEVER mention CI signing.
- Do not invent features.
- Do not invent fixes.
- Only describe changes supported by the supplied information.
- This is the first stable public release.
- Version: ${VERSION}

PROJECT:
APKUpdater Revival

VERSION:
${VERSION}

RECENT COMMITS:
${COMMITS}

CHANGED FILES:
${CHANGED_FILES}

BUILD:
Tests passed.
Lint passed.
APK successfully built.

Write:

## 🚀 What's New

A short exciting summary.

## ✨ Highlights

Bullet points of meaningful changes.

## 🛠️ Improvements

Bullet points if supported.

## 🐛 Fixes

Bullet points if supported.

## 📦 APK

State that APKUpdater ${VERSION} is available.

Keep it clean, professional, and not ridiculously long.
EOF
)"

          REQUEST="$(
            jq -n \
              --arg prompt "$PROMPT" \
              '{
                contents: [
                  {
                    parts: [
                      {
                        text: $prompt
                      }
                    ]
                  }
                ],
                generationConfig: {
                  temperature: 0.25,
                  maxOutputTokens: 2500
                }
              }'
          )"

          RESPONSE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 90 \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$REQUEST"
          )"

          AI_TEXT="$(
            echo "$RESPONSE" |
              jq -r '.candidates[0].content.parts[0].text // empty'
          )"

          if [[ -z "$AI_TEXT" ]]; then
            echo "Gemini returned no usable release description."
            exit 0
          fi

          printf '%s\n' "$AI_TEXT" > ai-release-notes.md

          echo "=========================================="
          echo " 🤖 GEMINI RELEASE NOTES GENERATED"
          echo "=========================================="

      # ============================================================
      # FALLBACK RELEASE NOTES
      # ============================================================

      - name: 📝 Prepare release description
        shell: bash
        run: |
          set -euo pipefail

          if [[ -s ai-release-notes.md ]]; then
            cp ai-release-notes.md final-release-notes.md
          else
            cat > final-release-notes.md <<EOF
## 🚀 APKUpdater ${VERSION}

The first stable release of APKUpdater Revival.

### ✨ Build

- APK successfully built
- Tests passed
- Android lint passed
- Automated CI build completed

### 📦 Download

Download the APK below.
EOF
          fi

      # ============================================================
      # APK ARTIFACT — APK ONLY
      # ============================================================

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: APKUpdater-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      # ============================================================
      # STABLE RELEASE
      # ============================================================

      - name: 🚀 Create stable GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: APKUpdater ${{ env.VERSION }}
          body_path: final-release-notes.md
          prerelease: false
          draft: false
          make_latest: true
          files: |
            ${{ env.APK_PATH }}

      # ============================================================
      # GITHUB SUMMARY
      # ============================================================

      - name: 📣 Final build summary
        shell: bash
        run: |
          {
            echo "# 🚀 APKUpdater ${VERSION}"
            echo
            echo "## Build"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| APK | \`APKUpdater-${VERSION}.apk\` |"
            echo "| APK Size | ${APK_SIZE_MB} MB |"
            echo "| Tests | ✅ Passed |"
            echo "| Lint | ✅ Passed |"
            echo "| Build | ✅ Passed |"
            echo
            echo "## 🤖 AI"
            echo
            if [[ -s ai-release-notes.md ]]; then
              echo "Gemini release description: ✅ Generated"
            else
              echo "Gemini release description: ⚠️ Fallback used"
            fi

            if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                  "${{ inputs.release }}" == "true" ]]; then
              echo
              echo "## 🎉 Stable Release"
              echo
              echo "**v${VERSION} is the first stable release.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
