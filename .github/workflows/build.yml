name: APKUpdater Revival - Build & Release

on:
  push:
    branches:
      - 3.x

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apkupdater-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  STABLE_VERSION: "1.0.0"

jobs:
  build:
    name: 🏗️ Build APKUpdater
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # JAVA
      # ============================================================

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # VERSION
      # ============================================================

      - name: 🔢 Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${STABLE_VERSION}"
            BUILD_TYPE="stable"
          else
            VERSION="${STABLE_VERSION}-ci.${GITHUB_RUN_NUMBER}"
            BUILD_TYPE="ci"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=${BUILD_TYPE}" >> "$GITHUB_ENV"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo " APKUpdater Build"
          echo "=========================================="
          echo "Version: ${VERSION}"
          echo "Type:    ${BUILD_TYPE}"
          echo "Commit:  ${GITHUB_SHA}"
          echo "Branch:  ${GITHUB_REF_NAME}"
          echo "=========================================="

      # ============================================================
      # PROJECT INFORMATION
      # ============================================================

      - name: 🧠 Analyze project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Project Information"
          echo "=========================================="

          echo "Repository:"
          echo "  $GITHUB_REPOSITORY"

          echo ""
          echo "Branch:"
          echo "  $GITHUB_REF_NAME"

          echo ""
          echo "Commit:"
          echo "  $GITHUB_SHA"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort \
            | head -100

      # ============================================================
      # GRADLE PERMISSIONS
      # ============================================================

      - name: 🔧 Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      # ============================================================
      # CLEAN
      # ============================================================

      - name: 🧹 Clean project
        shell: bash
        run: |
          ./gradlew clean --no-daemon --stacktrace

      # ============================================================
      # TESTS
      # ============================================================

      - name: 🧪 Run tests
        shell: bash
        run: |
          ./gradlew test --no-daemon --stacktrace

      # ============================================================
      # LINT
      # ============================================================

      - name: 🔍 Run Android lint
        shell: bash
        run: |
          ./gradlew lint --no-daemon --stacktrace

      # ============================================================
      # BUILD
      # ============================================================

      - name: 🏗️ Build APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # FIND APK
      # ============================================================

      - name: 🔎 Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          APK_PATH="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -print \
            | sort \
            | head -n 1)"

          if [[ -z "${APK_PATH}" ]]; then
            echo "❌ No APK was produced."
            echo ""
            echo "APK files found anywhere:"
            find . -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "Found:"
          echo "  ${APK_PATH}"

          mkdir -p release

          FINAL_APK="release/APKUpdater-${VERSION}.apk"

          cp "${APK_PATH}" "${FINAL_APK}"

          echo "APK_PATH=${FINAL_APK}" >> "$GITHUB_ENV"
          echo "apk_path=${FINAL_APK}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Final APK:"
          echo "  ${FINAL_APK}"

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: ✅ Verify APK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${APK_PATH}" ]]; then
            echo "❌ APK missing."
            exit 1
          fi

          if [[ ! -s "${APK_PATH}" ]]; then
            echo "❌ APK is empty."
            exit 1
          fi

          FILE_SIZE="$(stat -c%s "${APK_PATH}")"
          SHA256="$(sha256sum "${APK_PATH}" | awk '{print $1}')"

          echo "=========================================="
          echo " APK Verification"
          echo "=========================================="
          echo "File:   ${APK_PATH}"
          echo "Size:   ${FILE_SIZE} bytes"
          echo "SHA256: ${SHA256}"
          echo "=========================================="

          echo "APK_SIZE=${FILE_SIZE}" >> "$GITHUB_ENV"
          echo "APK_SHA256=${SHA256}" >> "$GITHUB_ENV"

      # ============================================================
      # GEMINI RELEASE NOTES
      # ============================================================

      - name: 🤖 Generate AI release notes
        id: gemini
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          echo "Preparing AI release notes..."

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "⚠️ GEMINI_API_KEY is not configured."
            exit 1
          fi

          COMMIT_MESSAGE="$(git log -1 --pretty=%s)"
          COMMIT_BODY="$(git log -1 --pretty=%b)"

          CHANGES="$(git diff-tree --no-commit-id --name-status -r HEAD || true)"

          if [[ -z "${CHANGES}" ]]; then
            CHANGES="No file-level changes were detected for this commit."
          fi

          PROMPT=$(cat <<EOF
You are writing release notes for the first stable release of an Android application called APKUpdater.

Release version:
${VERSION}

This is the FIRST REAL STABLE RELEASE.

Do NOT call it:
- debug
- debug APK
- testing APK
- test build
- development build
- prerelease
- beta
- alpha
- nightly
- CI build

Write concise, polished release notes for normal users.

Use this structure:

# APKUpdater ${VERSION}

## What's included
- 3 to 6 useful bullets describing the actual changes.
- Do not invent features.
- If the available information is limited, keep the wording general rather than making things up.

## Release
This is the first stable release of APKUpdater.

Do not include:
- hashes
- file sizes
- internal CI information
- GitHub Actions information
- API information
- Gemini information
- developer secrets
- raw commit hashes
- technical pipeline details

Latest commit:
${COMMIT_MESSAGE}

Commit body:
${COMMIT_BODY}

Changed files:
${CHANGES}
EOF
)

          python3 - <<'PY' > gemini-request.json
          import json
          import os

          prompt = os.environ["PROMPT"]

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.25,
                  "maxOutputTokens": 2500
              }
          }

          print(json.dumps(payload))
          PY

          HTTP_STATUS="$(curl \
            --silent \
            --show-error \
            --location \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-goog-api-key: ${GEMINI_API_KEY}" \
            --output gemini-response.json \
            --write-out "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            --data-binary @gemini-request.json)"

          echo "Gemini HTTP status: ${HTTP_STATUS}"

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "❌ Gemini request failed."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("gemini-response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          candidates = data.get("candidates", [])

          if not candidates:
              raise SystemExit("Gemini returned no candidates.")

          text = (
              candidates[0]
              .get("content", {})
              .get("parts", [{}])[0]
              .get("text", "")
              .strip()
          )

          if not text:
              raise SystemExit("Gemini returned empty release notes.")

          with open("ai-release-notes.md", "w", encoding="utf-8") as f:
              f.write(text)
          PY

          if [[ ! -s ai-release-notes.md ]]; then
            echo "❌ AI release notes were empty."
            exit 1
          fi

          echo "✅ AI release notes generated."

      # ============================================================
      # FALLBACK RELEASE NOTES
      # ============================================================

      - name: 📝 Create release notes fallback
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -s ai-release-notes.md ]]; then
            cp ai-release-notes.md final-release-notes.md
            echo "Using AI-generated release notes."
          else
            cat > final-release-notes.md <<EOF
          # APKUpdater ${VERSION}

          ## What's included

          - First stable release of APKUpdater.
          - Android application build validated by automated tests and lint.
          - Release package prepared automatically by the project build system.

          ## Release

          This is the first stable release of APKUpdater.
          EOF

            echo "Using safe fallback release notes."
          fi

          echo ""
          echo "Release notes:"
          cat final-release-notes.md

      # ============================================================
      # UPLOAD APK ONLY
      # ============================================================

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: APKUpdater-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          archive: false

      # ============================================================
      # STABLE GITHUB RELEASE
      # ============================================================

      - name: 🚀 Create stable GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.STABLE_VERSION }}
          name: APKUpdater ${{ env.STABLE_VERSION }}
          body_path: final-release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.APK_PATH }}

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: 📊 Final build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# 🚀 APKUpdater Build"
            echo ""
            echo "## Build"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Type | \`${BUILD_TYPE}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Java | \`${JAVA_VERSION}\` |"
            echo ""
            echo "## APK"
            echo ""
            if [[ -f "${APK_PATH:-}" ]]; then
              echo "| Property | Value |"
              echo "|---|---|"
              echo "| File | \`$(basename "${APK_PATH}")\` |"
              echo "| Size | \`${APK_SIZE:-unknown}\` bytes |"
              echo "| SHA-256 | \`${APK_SHA256:-unknown}\` |"
            else
              echo "APK was not produced."
            fi

            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo ""
              echo "## Release"
              echo ""
              echo "✅ Stable release: \`v${STABLE_VERSION}\`"
              echo ""
              echo "📦 The GitHub Release contains only the APK."
            else
              echo ""
              echo "## CI"
              echo ""
              echo "✅ CI build completed."
              echo ""
              echo "ℹ️ No stable release was created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
