name: APKUpdater Revival - Build & Release

on:
  push:
    branches:
      - 3.x

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apkupdater-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  STABLE_VERSION: "1.0.0"

jobs:
  build:
    name: 🏗️ Build APKUpdater
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # JAVA
      # ============================================================

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # VERSION
      # ============================================================

      - name: 🔢 Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${STABLE_VERSION}"
            BUILD_TYPE="stable"
          else
            VERSION="${STABLE_VERSION}-ci.${GITHUB_RUN_NUMBER}"
            BUILD_TYPE="ci"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=${BUILD_TYPE}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo " APKUpdater Build"
          echo "=========================================="
          echo "Version: ${VERSION}"
          echo "Type:    ${BUILD_TYPE}"
          echo "Branch:  ${GITHUB_REF_NAME}"
          echo "Commit:  ${GITHUB_SHA}"
          echo "=========================================="

      # ============================================================
      # PROJECT INFO
      # ============================================================

      - name: 🧠 Analyze project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Project Information"
          echo "=========================================="

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch:     ${GITHUB_REF_NAME}"
          echo "Commit:     ${GITHUB_SHA}"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      # ============================================================
      # GRADLE
      # ============================================================

      - name: 🔧 Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      # ============================================================
      # CLEAN
      # ============================================================

      - name: 🧹 Clean project
        shell: bash
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # TESTS
      # ============================================================

      - name: 🧪 Run tests
        shell: bash
        run: |
          ./gradlew test \
            --no-daemon \
            --stacktrace

      # ============================================================
      # LINT
      # ============================================================

      - name: 🔍 Run Android lint
        shell: bash
        run: |
          ./gradlew lint \
            --no-daemon \
            --stacktrace

      # ============================================================
      # BUILD
      # ============================================================

      - name: 🏗️ Build APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # FIND APK
      # ============================================================

      - name: 🔎 Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -print \
            | sort \
            | head -n 1)"

          if [[ -z "${APK_SOURCE}" ]]; then
            echo "❌ No APK was produced."
            echo ""
            echo "APK files found:"
            find . -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK source:"
          echo "${APK_SOURCE}"

          mkdir -p release

          FINAL_APK="release/APKUpdater-${VERSION}.apk"

          cp "${APK_SOURCE}" "${FINAL_APK}"

          if [[ ! -f "${FINAL_APK}" ]]; then
            echo "❌ Failed to copy APK."
            exit 1
          fi

          if [[ ! -s "${FINAL_APK}" ]]; then
            echo "❌ APK is empty."
            exit 1
          fi

          echo "APK_PATH=${FINAL_APK}" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          echo "${FINAL_APK}"

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: ✅ Verify APK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${APK_PATH}" ]]; then
            echo "❌ APK does not exist."
            exit 1
          fi

          if [[ ! -s "${APK_PATH}" ]]; then
            echo "❌ APK is empty."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "${APK_PATH}")"
          APK_SHA256="$(sha256sum "${APK_PATH}" | awk '{print $1}')"

          echo "=========================================="
          echo " APK VERIFIED"
          echo "=========================================="
          echo "File:   ${APK_PATH}"
          echo "Size:   ${APK_SIZE} bytes"
          echo "SHA256: ${APK_SHA256}"
          echo "=========================================="

          echo "APK_SIZE=${APK_SIZE}" >> "$GITHUB_ENV"
          echo "APK_SHA256=${APK_SHA256}" >> "$GITHUB_ENV"

      # ============================================================
      # COLLECT CHANGE INFORMATION
      # ============================================================

      - name: 📋 Collect release information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE="$(git log -1 --pretty=%s)"
          COMMIT_BODY="$(git log -1 --pretty=%b)"

          CHANGES="$(git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            HEAD || true)"

          if [[ -z "${CHANGES}" ]]; then
            CHANGES="No file-level changes were detected for this commit."
          fi

          {
            echo "COMMIT_MESSAGE<<EOF"
            echo "${COMMIT_MESSAGE}"
            echo "EOF"

            echo "COMMIT_BODY<<EOF"
            echo "${COMMIT_BODY}"
            echo "EOF"

            echo "CHANGES<<EOF"
            echo "${CHANGES}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ============================================================
      # AI RELEASE NOTES
      # ============================================================

      - name: 🤖 Generate AI release notes
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERSION: ${{ env.VERSION }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
          COMMIT_BODY: ${{ env.COMMIT_BODY }}
          CHANGES: ${{ env.CHANGES }}
        run: |
          set -u

          echo "=========================================="
          echo " AI RELEASE NOTES"
          echo "=========================================="

          # ----------------------------------------------------------
          # Always create a valid fallback first.
          # This guarantees the release can continue even if Gemini
          # is unavailable.
          # ----------------------------------------------------------

          cat > final-release-notes.md <<EOF
          # APKUpdater ${VERSION}

          ## What's included

          - First stable release of APKUpdater.
          - Automated Android build verified with project tests and lint.
          - Release APK prepared automatically from the ${GITHUB_REF_NAME} branch.

          ## Release

          This is the first stable release of APKUpdater.
          EOF

          # ----------------------------------------------------------
          # No Gemini secret = fallback, but NOT a failure.
          # ----------------------------------------------------------

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "⚠️ GEMINI_API_KEY is not configured."
            echo "ℹ️ Using built-in release notes."
            exit 0
          fi

          # ----------------------------------------------------------
          # Create Gemini request using Python.
          # ----------------------------------------------------------

          python3 - <<'PY'
          import json
          import os

          version = os.environ.get("VERSION", "1.0.0")
          commit_message = os.environ.get("COMMIT_MESSAGE", "")
          commit_body = os.environ.get("COMMIT_BODY", "")
          changes = os.environ.get("CHANGES", "")

          prompt = f"""Write polished GitHub release notes for APKUpdater version {version}.

          This is the FIRST REAL STABLE RELEASE.

          IMPORTANT:
          - Never describe the app as debug.
          - Never say debug APK.
          - Never say testing build.
          - Never say development build.
          - Never say prerelease.
          - Never say beta.
          - Never say alpha.
          - Never say nightly.
          - Never mention GitHub Actions.
          - Never mention Gemini.
          - Never mention CI.
          - Never mention internal automation.
          - Never include hashes.
          - Never include file sizes.
          - Never invent features.

          Use exactly this general structure:

          # APKUpdater {version}

          ## What's included

          - 3 to 6 concise bullets describing real changes.
          - Only describe things supported by the supplied information.

          ## Release

          This is the first stable release of APKUpdater.

          Latest commit:
          {commit_message}

          Commit details:
          {commit_body}

          Changed files:
          {changes}
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "thinkingConfig": {
                      "thinkingLevel": "low"
                  },
                  "maxOutputTokens": 2000
              }
          }

          with open("gemini-request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          # ----------------------------------------------------------
          # Call Gemini.
          # ----------------------------------------------------------

          HTTP_STATUS="$(curl \
            --silent \
            --show-error \
            --location \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-goog-api-key: ${GEMINI_API_KEY}" \
            --output gemini-response.json \
            --write-out "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            --data-binary @gemini-request.json \
            || true)"

          echo "Gemini HTTP status: ${HTTP_STATUS}"

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "⚠️ Gemini did not return HTTP 200."
            echo "ℹ️ Keeping built-in release notes."
            exit 0
          fi

          # ----------------------------------------------------------
          # Extract Gemini response.
          # ----------------------------------------------------------

          python3 - <<'PY'
          import json
          import sys

          try:
              with open("gemini-response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              candidates = data.get("candidates", [])

              if not candidates:
                  raise ValueError("No candidates returned")

              parts = candidates[0].get("content", {}).get("parts", [])

              generated = ""

              for part in parts:
                  if isinstance(part, dict) and part.get("text"):
                      generated += part["text"]

              generated = generated.strip()

              if not generated:
                  raise ValueError("Gemini returned empty text")

              with open("ai-release-notes.md", "w", encoding="utf-8") as f:
                  f.write(generated)

          except Exception as error:
              print(f"Gemini response parsing failed: {error}")
              sys.exit(1)
          PY

          # ----------------------------------------------------------
          # Use Gemini output only when it is actually valid.
          # Otherwise keep fallback.
          # ----------------------------------------------------------

          if [[ -s "ai-release-notes.md" ]]; then
            cp ai-release-notes.md final-release-notes.md
            echo "✅ Gemini release notes successfully generated."
          else
            echo "⚠️ Gemini output was empty."
            echo "ℹ️ Using built-in release notes."
          fi

          echo ""
          echo "=========================================="
          echo " FINAL RELEASE NOTES"
          echo "=========================================="

          cat final-release-notes.md

          echo ""
          echo "=========================================="
          echo " Release notes step completed successfully."
          echo "=========================================="

      # ============================================================
      # VERIFY RELEASE NOTES
      # ============================================================

      - name: 📝 Verify release notes
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "final-release-notes.md" ]]; then
            echo "❌ Release notes file does not exist."
            exit 1
          fi

          if [[ ! -s "final-release-notes.md" ]]; then
            echo "❌ Release notes file is empty."
            exit 1
          fi

          echo "✅ Release notes are ready."
          echo ""
          cat final-release-notes.md

      # ============================================================
      # UPLOAD ONLY THE APK
      # ============================================================

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: APKUpdater-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          archive: false

      # ============================================================
      # CREATE FIRST STABLE RELEASE
      # ============================================================

      - name: 🚀 Create stable GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.STABLE_VERSION }}
          name: APKUpdater ${{ env.STABLE_VERSION }}
          body_path: final-release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.APK_PATH }}

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: 📊 Final build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# 🚀 APKUpdater Build"
            echo ""
            echo "## Build"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Type | \`${BUILD_TYPE}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Java | \`${JAVA_VERSION}\` |"
            echo ""

            if [[ -f "${APK_PATH:-}" ]]; then
              echo "## APK"
              echo ""
              echo "| Property | Value |"
              echo "|---|---|"
              echo "| File | \`$(basename "${APK_PATH}")\` |"
              echo "| Size | \`${APK_SIZE:-unknown}\` bytes |"
              echo "| SHA-256 | \`${APK_SHA256:-unknown}\` |"
            else
              echo "## APK"
              echo ""
              echo "APK was not produced."
            fi

            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo ""
              echo "## Stable Release"
              echo ""
              echo "✅ Release: \`v${STABLE_VERSION}\`"
              echo ""
              echo "📦 GitHub Release contains only the APK."
            else
              echo ""
              echo "## CI"
              echo ""
              echo "✅ CI build completed."
              echo ""
              echo "ℹ️ No stable release was created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
