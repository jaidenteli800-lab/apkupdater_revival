name: APKUpdater Revival - Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (example: 1.1.0)"
        required: true
        type: string

      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - Stable Release
          - Pre-release

      release_notes:
        description: "Write exactly what you want included in the release notes"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apkupdater-revival-build-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  APP_NAME: "APKUpdater Revival"

jobs:
  build:
    name: Build APKUpdater Revival
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ==========================================
      # SET RELEASE INFORMATION
      # ==========================================

      - name: Set release information
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          RELEASE_TYPE="${{ inputs.release_type }}"

          if [[ "${RELEASE_TYPE}" == "Stable Release" ]]; then
            PRERELEASE="false"
            TYPE_NAME="stable"
          else
            PRERELEASE="true"
            TYPE_NAME="pre-release"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TYPE=${TYPE_NAME}" >> "$GITHUB_ENV"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo " APKUpdater Revival"
          echo "=========================================="
          echo "Version:      ${VERSION}"
          echo "Release type: ${TYPE_NAME}"
          echo "Run number:   ${GITHUB_RUN_NUMBER}"
          echo "Branch:       ${GITHUB_REF_NAME}"
          echo "Commit:       ${GITHUB_SHA}"
          echo "=========================================="

      # ==========================================
      # PROJECT INFORMATION
      # ==========================================

      - name: Analyze project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch:     ${GITHUB_REF_NAME}"
          echo "Commit:     ${GITHUB_SHA}"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      # ==========================================
      # GRADLE
      # ==========================================

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Clean project
        shell: bash
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ==========================================
      # TESTS
      # ==========================================

      - name: Run tests
        shell: bash
        run: |
          ./gradlew test \
            --no-daemon \
            --stacktrace

      # ==========================================
      # LINT
      # ==========================================

      - name: Run Android lint
        shell: bash
        run: |
          ./gradlew lint \
            --no-daemon \
            --stacktrace

      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================
      # FIND APK
      # ==========================================

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -print \
            | sort \
            | head -n 1)"

          if [[ -z "${APK_SOURCE}" ]]; then
            echo "❌ No APK was produced."
            echo ""
            echo "APK files found:"
            find . -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK source:"
          echo "${APK_SOURCE}"

          mkdir -p release

          FINAL_APK="release/APKUpdater-Revival-${VERSION}.apk"

          cp "${APK_SOURCE}" "${FINAL_APK}"

          if [[ ! -f "${FINAL_APK}" ]]; then
            echo "❌ Failed to copy APK."
            exit 1
          fi

          if [[ ! -s "${FINAL_APK}" ]]; then
            echo "❌ APK is empty."
            exit 1
          fi

          echo "APK_PATH=${FINAL_APK}" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          echo "${FINAL_APK}"

      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${APK_PATH}" ]]; then
            echo "❌ APK does not exist."
            exit 1
          fi

          if [[ ! -s "${APK_PATH}" ]]; then
            echo "❌ APK is empty."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "${APK_PATH}")"
          APK_SHA256="$(sha256sum "${APK_PATH}" | awk '{print $1}')"

          echo "=========================================="
          echo " APK VERIFIED"
          echo "=========================================="
          echo "File:   ${APK_PATH}"
          echo "Size:   ${APK_SIZE} bytes"
          echo "SHA256: ${APK_SHA256}"
          echo "=========================================="

          echo "APK_SIZE=${APK_SIZE}" >> "$GITHUB_ENV"
          echo "APK_SHA256=${APK_SHA256}" >> "$GITHUB_ENV"

      # ==========================================
      # RELEASE NOTES
      # ==========================================

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail

          cat > final-release-notes.md <<'EOF'
          ${{ inputs.release_notes }}
          EOF

          if [[ ! -s "final-release-notes.md" ]]; then
            echo "❌ Release notes are empty."
            exit 1
          fi

          echo "=========================================="
          echo " RELEASE NOTES"
          echo "=========================================="

          cat final-release-notes.md

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: APKUpdater-Revival-${{ inputs.version }}-run-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          archive: false

      # ==========================================
      # CREATE UNIQUE RELEASE
      # ==========================================

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}

          # The RELEASE NAME is CLEAN.
          # The run number is NOT shown here.
          name: APKUpdater Revival ${{ inputs.version }}

          # The TAG is unique so another build of the
          # same version creates a completely new release.
          tag_name: v${{ inputs.version }}-build-${{ github.run_number }}

          body_path: final-release-notes.md

          draft: false

          prerelease: ${{ env.PRERELEASE }}

          make_latest: ${{ env.RELEASE_TYPE == 'stable' }}

          target_commitish: ${{ github.sha }}

          files: |
            ${{ env.APK_PATH }}

      # ==========================================
      # FINAL SUMMARY
      # ==========================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# APKUpdater Revival Build"
            echo ""
            echo "## Release"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| App | \`APKUpdater Revival\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Type | \`${RELEASE_TYPE}\` |"
            echo "| Run | \`${GITHUB_RUN_NUMBER}\` |"
            echo "| Tag | \`v${VERSION}-build-${GITHUB_RUN_NUMBER}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""

            if [[ -f "${APK_PATH:-}" ]]; then
              echo "## APK"
              echo ""
              echo "| Property | Value |"
              echo "|---|---|"
              echo "| File | \`$(basename "${APK_PATH}")\` |"
              echo "| Size | \`${APK_SIZE:-unknown}\` bytes |"
              echo "| SHA-256 | \`${APK_SHA256:-unknown}\` |"
            else
              echo "APK was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
